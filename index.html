<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<title>Monitoring Kualitas Tomat</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    margin:0;
    transition:0.3s;
}

/* DARK MODE */
.dark{
    background:#121212;
    color:white;
}

.dark .box,
.dark .container,
.dark .chart-box{
    background:#1e1e1e;
    color:white;
}

.dark table{
    color:white;
}

.dark th{
    background:#1e1e1e;
    color:#ccc;
}

.dark td{
    border-bottom:1px solid #333;
}

.dark .table-wrapper::-webkit-scrollbar-thumb{
    background:#444;
}

/* HEADER */
.header{
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    color:white;
}

/* BUTTON */
.btn{
    cursor:pointer;
    padding:8px 14px;
    border:none;
    border-radius:10px;
    margin-left:10px;
    font-weight:600;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
}

.btn-sound{
    background:#2ecc71;
    color:white;
}

.btn-dark{
    background:#222;
    color:white;
}

.btn-download{
    background:#e67e22;
    color:white;
}

/* SUMMARY */
.summary{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:30px 40px;
}

.box{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    transition:0.3s;
}

.box:hover{
    transform:translateY(-5px);
}

.green{
    border-left:6px solid #2ecc71;
}

.yellow{
    border-left:6px solid #f1c40f;
}

.red{
    border-left:6px solid #e74c3c;
}

/* CHART */
.chart-wrapper{
    display:flex;
    justify-content:center;
    margin:30px 0;
}

.chart-box{
    width:420px;
    height:420px;
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* TABLE */
.container{
    margin:20px 40px;
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 8px 20px rgba(0,0,0,0.06);
}

.table-wrapper{
    max-height:400px;
    overflow-y:auto;
}

.table-wrapper::-webkit-scrollbar{
    width:6px;
}

.table-wrapper::-webkit-scrollbar-thumb{
    background:#bbb;
    border-radius:10px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:center;
}

th{
    position:sticky;
    top:0;
    background:white;
    color:gray;
}

/* BADGE */
.badge{
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:500;
}

/* ukuran */
.besar{
    background:#eef3ff;
    color:#3b82f6;
}

.kecil{
    background:#f1f1f1;
    color:#555;
}

/* kategori */
.matang{
    background:#e8f8f1;
    color:#27ae60;
}

.mentah{
    background:#fff4e5;
    color:#e67e22;
}

.mengkal{
    background:#fdecea;
    color:#e74c3c;
}

/* status */
.acceptable{
    background:#d1fae5;
    color:#065f46;
}

.reject{
    background:#fee2e2;
    color:#991b1b;
}

/* TOAST */
#toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#222;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    opacity:0;
    transition:0.4s;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    <div>
        <h1>🍅 Welcome to Tomato Quality Monitoring System</h1>
        <p>Real-Time Monitoring and Classification of Tomato Quality</p>
    </div>

    <div>

        <button class="btn btn-sound"
        onclick="enableSound()">
        🔊 Suara
        </button>

        <button class="btn btn-dark"
        onclick="toggleDark()">
        🌙 Dark
        </button>

        <button class="btn btn-download"
        onclick="downloadCSV()">
        ⬇ Download CSV
        </button>

    </div>

</div>

<!-- SUMMARY -->
<div class="summary">

    <div class="box">
        <h3>Total</h3>
        <h1 id="total">0</h1>
    </div>

    <div class="box green">
        <h3>Matang</h3>
        <h1 id="matang">0</h1>
    </div>

    <div class="box yellow">
        <h3>Mentah</h3>
        <h1 id="mentah">0</h1>
    </div>

    <div class="box red">
        <h3>Mengkal</h3>
        <h1 id="mengkal">0</h1>
    </div>

</div>

<!-- CHART -->
<div class="chart-wrapper">

    <div class="chart-box">
        <canvas id="chart"></canvas>
    </div>

</div>

<!-- TABLE -->
<div class="container">

    <h3>Data Tomat</h3>

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Dimensi</th>
                    <th>Ukuran</th>
                    <th>Kategori</th>
                    <th>Status</th>
                    <th>Akurasi</th>
                </tr>
            </thead>

            <tbody id="tableData"></tbody>

        </table>

    </div>

</div>

<div id="toast"></div>

<script>

// SOUND
let audio;
let soundEnabled = false;

function enableSound(){

    audio = new Audio(
    "https://www.soundjay.com/buttons/sounds/button-3.mp3"
    );

    soundEnabled = true;

    alert("🔊 Suara aktif!");
}

// DARK MODE
function toggleDark(){

    document.body.classList.toggle("dark");
}

// TOAST
function showToast(msg){

    const t = document.getElementById("toast");

    t.innerText = msg;

    t.style.opacity = "1";

    if(soundEnabled && audio){

        audio.currentTime = 0;

        audio.play().catch(()=>{});
    }

    setTimeout(()=>{
        t.style.opacity = "0";
    },2500);
}

// DOWNLOAD CSV
function downloadCSV(){

    fetch("/history")

    .then(res => res.json())

    .then(data => {

        let csv =
        "ID,Dimensi,Ukuran,Kategori,Status,Akurasi\n";

        data.forEach((item)=>{

            csv +=
            `${item.id},
            ${item.panjang}x${item.lebar}x${item.tinggi},
            ${item.ukuran},
            ${item.kategori},
            ${item.status},
            ${item.akurasi}%\n`;
        });

        const blob =
        new Blob([csv], {type:"text/csv"});

        const url =
        window.URL.createObjectURL(blob);

        const a =
        document.createElement("a");

        a.href = url;

        a.download = "data_tomat.csv";

        a.click();

        showToast("📥 CSV berhasil didownload!");

    });
}

// CHART
const ctx = document.getElementById("chart");

let chart = new Chart(ctx, {

    type:'doughnut',

    data:{
        labels:['Matang','Mentah','Mengkal'],
        datasets:[{
            data:[0,0,0],
            backgroundColor:[
                '#2ecc71',
                '#f1c40f',
                '#e74c3c'
            ]
        }]
    },

    options:{
        responsive:true,
        maintainAspectRatio:false,
        cutout:'65%'
    }

});

// LOAD DATA
let lastCount = 0;

function loadData(){

    fetch("/history")

    .then(res => res.json())

    .then(data => {

        let matang = 0;
        let mentah = 0;
        let mengkal = 0;

        const tbody =
            document.getElementById("tableData");

        tbody.innerHTML = "";

        data.slice(-20).forEach((item)=>{

            const kategori =
                (item.kategori || "").toLowerCase();

            const status =
                (item.status || "").toLowerCase();

            if(kategori === "matang"){
                matang++;
            }
            else if(kategori === "mentah"){
                mentah++;
            }
            else if(kategori === "mengkal"){
                mengkal++;
            }

            tbody.innerHTML += `
            <tr>

                <td>${item.id}</td>

                <td>
                    ${item.panjang} x
                    ${item.lebar} x
                    ${item.tinggi} cm
                </td>

                <td>
                    <span class="badge ${item.ukuran}">
                        ${item.ukuran}
                    </span>
                </td>

                <td>
                    <span class="badge ${kategori}">
                        ${kategori}
                    </span>
                </td>

                <td>
                    <span class="badge ${status}">
                        ${status}
                    </span>
                </td>

                <td>${item.akurasi}%</td>

            </tr>
            `;
        });

        document.getElementById("total")
        .innerText = data.length;

        document.getElementById("matang")
        .innerText = matang;

        document.getElementById("mentah")
        .innerText = mentah;

        document.getElementById("mengkal")
        .innerText = mengkal;

        chart.data.datasets[0].data = [
            matang,
            mentah,
            mengkal
        ];

        chart.update();

        if(data.length > lastCount){

            showToast("🍅 Data baru masuk!");

            lastCount = data.length;
        }

    })

    .catch(err => console.log(err));
}

loadData();

setInterval(loadData,2000);

</script>

</body>
</html>
